# Alembic configuration for the AEC IVRS backend.
#
# The database URL is NOT defined here: migrations/env.py reuses the engine from
# database.py so the app, the CLI and Alembic always point at the same database.
#
# Common commands (run from the backend/ directory):
#   alembic upgrade head                                   # apply pending migrations
#   alembic current                                        # show the applied revision
#   alembic revision --autogenerate --rev-id 0002 -m "add user roles"
#
# The backend also applies pending migrations automatically on startup
# (see bootstrap.run_migrations), so a manual upgrade is rarely needed.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Name revision files "<rev-id>_<slug>.py", e.g. 0002_add_user_roles.py.
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
